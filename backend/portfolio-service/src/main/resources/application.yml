spring:
  application:
    name: portfolio-service

  # Virtual Threads (Java 21+)
  threads:
    virtual:
      enabled: true

  # Database Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/winvestco_portfolio_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate properties
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Jackson Configuration
  jackson:
    time-zone: Asia/Kolkata
    date-format: dd-MM-yyyy HH:mm:ss

  # RabbitMQ Configuration (for listening to UserCreatedEvent)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:portfolio-service-market-quote-consumer}
      auto-offset-reset: ${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
    topics:
      market-quote:
        name: ${MARKET_QUOTE_TOPIC:market.quote.v1}
        dlt-name: ${MARKET_QUOTE_DLT_TOPIC:market.quote.v1.dlt.portfolio-service}
        partitions: ${MARKET_QUOTE_TOPIC_PARTITIONS:12}
        replicas: ${MARKET_QUOTE_TOPIC_REPLICAS:1}

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms

  # Enable bean definition overriding
  main:
    allow-bean-definition-overriding: true

  # Flyway configuration
  flyway:
    repair-on-migrate: true
    validate-on-migrate: false

  cloud:
    compatibility-verifier:
      enabled: false
    openfeign:
      circuitbreaker:
        enabled: true

server:
  port: ${SERVER_PORT:8085}

# Eureka Client Configuration
eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}:${random.value}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# Enable Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true  # Enables /actuator/health/liveness and /actuator/health/readiness
    prometheus:
      enabled: true
  health:
    # Kubernetes probes
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    # Dependency health indicators
    db:
      enabled: true
    rabbit:
      enabled: true
    diskSpace:
      enabled: true
      threshold: 10MB
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  # OpenTelemetry Tracing Configuration
  tracing:
    enabled: true
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      transport: http

# Springdoc Configuration
springdoc:
  swagger-ui:
    tryItOutEnabled: false

# Logging Configuration
logging:
  level:
    org.springframework.security: DEBUG
    in.winvestco.portfolio_service: DEBUG

# JWT Configuration (must match api-gateway)
jwt:
  secret: ${JWT_SECRET:dev-secret-key-for-local-development-only-change-in-production-minimum-256-bits}
  expiration: ${JWT_EXPIRATION:86400000}

trading:
  kafka:
    market-quote:
      startup-replay-offset: ${MARKET_QUOTE_STARTUP_REPLAY_OFFSET:committed}
      retry:
        max-attempts: ${MARKET_QUOTE_RETRY_MAX_ATTEMPTS:4}
        initial-interval-ms: ${MARKET_QUOTE_RETRY_INITIAL_INTERVAL_MS:500}
        multiplier: ${MARKET_QUOTE_RETRY_MULTIPLIER:2.0}
        max-interval-ms: ${MARKET_QUOTE_RETRY_MAX_INTERVAL_MS:5000}

# Resilience4j Configuration
resilience4j:
  # Circuit Breaker - Fail-fast for market data and dependencies
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - feign.FeignException$ServiceUnavailable
          - feign.FeignException$InternalServerError
          - org.springframework.dao.DataAccessException
        ignoreExceptions:
          - feign.FeignException$BadRequest
          - feign.FeignException$NotFound
          - in.winvestco.common.exception.NonRetryableException
    instances:
      marketService:
        baseConfig: default
        failureRateThreshold: 40  # Moderate for market data
      fundsService:
        baseConfig: default
        failureRateThreshold: 30  # Stricter for financial data
      database:
        baseConfig: default
        failureRateThreshold: 30  # Stricter for database

  # Retry - Exponential Backoff with Jitter
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: true
        randomizedWaitFactor: 0.5
        retryExceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - feign.RetryableException
          - org.springframework.dao.TransientDataAccessException
        ignoreExceptions:
          - feign.FeignException$BadRequest
          - feign.FeignException$NotFound
          - feign.FeignException$Unauthorized
          - in.winvestco.common.exception.NonRetryableException
    instances:
      marketService:
        baseConfig: default
      fundsService:
        baseConfig: default
        maxAttempts: 2  # Fewer retries for financial operations
      database:
        baseConfig: default
        maxAttempts: 2  # Fewer retries for database operations

  # Bulkhead - Resource Isolation
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 20
        maxWaitDuration: 100ms
    instances:
      marketService:
        maxConcurrentCalls: 15  # Allow more concurrent market data calls
        maxWaitDuration: 150ms
      fundsService:
        maxConcurrentCalls: 10  # Limit concurrent financial operations
        maxWaitDuration: 50ms
      database:
        maxConcurrentCalls: 10
        maxWaitDuration: 50ms

  # TimeLimiter - Timeout Control
  timelimiter:
    instances:
      marketService:
        timeoutDuration: 5s  # Longer timeout for market data
        cancelRunningFuture: true
      fundsService:
        timeoutDuration: 3s
        cancelRunningFuture: true
      database:
        timeoutDuration: 3s
        cancelRunningFuture: true
