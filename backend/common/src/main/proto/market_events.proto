syntax = "proto3";

package winvestco.market.events;

option java_package = "in.winvestco.common.kafka.market";
option java_outer_classname = "MarketEventsProto";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

// Canonical quote update event for Kafka topic market.quote.v1.
// Partition key: symbol (uppercase).
message QuoteUpdatedEvent {
  string event_id = 1;
  string event_version = 2; // e.g. "v1"
  google.protobuf.Timestamp event_time = 3;
  string source = 4; // e.g. "market-service"
  string trace_id = 5;

  string symbol = 6;
  string exchange = 7;
  double last_price = 8;
  double open = 9;
  double high = 10;
  double low = 11;
  double close = 12;
  double change = 13;
  double change_percent = 14;
  int64 volume = 15;
}

// Optional index snapshot event for Kafka topic market.index.v1.
// Partition key: index_symbol (uppercase).
message IndexSnapshotEvent {
  string event_id = 1;
  string event_version = 2; // e.g. "v1"
  google.protobuf.Timestamp event_time = 3;
  string source = 4; // e.g. "market-service"
  string trace_id = 5;

  string index_symbol = 6; // e.g. NIFTY50
  string index_name = 7;   // e.g. NIFTY 50
  double last_price = 8;
  double change = 9;
  double change_percent = 10;
  int64 volume = 11;

  repeated IndexConstituent constituents = 12;
}

message IndexConstituent {
  string symbol = 1;
  string exchange = 2;
  double last_price = 3;
  double weightage = 4;
}

// Optional trading status event for market status transitions.
message TradingStatusEvent {
  string event_id = 1;
  string event_version = 2; // e.g. "v1"
  google.protobuf.Timestamp event_time = 3;
  string source = 4; // e.g. "market-service"
  string trace_id = 5;

  string exchange = 6;
  string status = 7; // PRE_OPEN, OPEN, CLOSED, HALTED
  string reason = 8;
}
