spring:
  application:
    name: user-service

  # Virtual Threads (Java 21+)
  threads:
    virtual:
      enabled: true

  # Database Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/winvestco_user_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate properties
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # OAuth2 Resource Server Configuration (Handled manually in SecurityConfig)



  # Jackson Configuration
  jackson:
    time-zone: Asia/Kolkata
    date-format: dd-MM-yyyy HH:mm:ss

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: ${RABBITMQ_PASSWORD:guest}
    template:
      default-receive-queue: ${RABBITMQ_QUEUE:user.queue}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000

  # Enable bean definition overriding
  main:
    allow-bean-definition-overriding: true

  # Redis Configuration
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}

  session:
    store-type: redis
    redis:
      namespace: trading:user

  # Flyway configuration
  flyway:
    repair-on-migrate: true
    validate-on-migrate: false

  cloud:
    compatibility-verifier:
      enabled: false

server:
  port: ${SERVER_PORT:8088}

# Eureka Client Configuration
eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}:${random.value}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# Enable Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true  # Enables /actuator/health/liveness and /actuator/health/readiness
    prometheus:
      enabled: true
  health:
    # Kubernetes probes
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    # Dependency health indicators
    db:
      enabled: true
    redis:
      enabled: true
    rabbit:
      enabled: true
    diskSpace:
      enabled: true
      threshold: 10MB
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  # OpenTelemetry Tracing Configuration
  tracing:
    enabled: true
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      transport: http

# Springdoc Configuration
springdoc:
  swagger-ui:
    tryItOutEnabled: false

# Logging Configuration
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.web.FilterChainProxy: DEBUG

# JWT Configuration (must match api-gateway)
jwt:
  secret: ${JWT_SECRET:dev-secret-key-for-local-development-only-change-in-production-minimum-256-bits}
  expiration: ${JWT_EXPIRATION:86400000}

# Resilience4j Configuration
resilience4j:
  # Circuit Breaker - Fail-fast for database and Redis dependencies
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - org.springframework.dao.DataAccessException
          - org.springframework.data.redis.RedisConnectionFailureException
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException$BadRequest
          - org.springframework.web.client.HttpClientErrorException$NotFound
          - in.winvestco.common.exception.NonRetryableException
    instances:
      database:
        baseConfig: default
        failureRateThreshold: 30  # Stricter for database
      redis:
        baseConfig: default
        failureRateThreshold: 40  # Moderate for Redis cache

  # Retry - Exponential Backoff with Jitter for database operations
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: true
        randomizedWaitFactor: 0.5
        retryExceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - org.springframework.dao.TransientDataAccessException
          - org.springframework.data.redis.RedisConnectionFailureException
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException$BadRequest
          - org.springframework.web.client.HttpClientErrorException$NotFound
          - org.springframework.web.client.HttpClientErrorException$Unauthorized
          - in.winvestco.common.exception.NonRetryableException
    instances:
      database:
        baseConfig: default
        maxAttempts: 2  # Fewer retries for database operations
      redis:
        baseConfig: default

  # Bulkhead - Resource Isolation
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 20
        maxWaitDuration: 100ms
    instances:
      database:
        maxConcurrentCalls: 10  # Limit concurrent database calls
        maxWaitDuration: 50ms
      redis:
        baseConfig: default

  # TimeLimiter - Timeout Control
  timelimiter:
    instances:
      database:
        timeoutDuration: 3s
        cancelRunningFuture: true
      redis:
        timeoutDuration: 1s  # Faster timeout for cache operations
        cancelRunningFuture: true
